# BCG PDF (BCG build of PdfCraft): every push to `bcg` builds the web app and publishes it as a
# GitHub Release, which the BCG Portal deploys (RebelEFX/bcg-portal, apps/pdf/pdfcraft.lock.json).
#
# The build steps copy upstream's release workflow (release.yml, job `web`) so the zip has the
# same layout: pdfcraft-web-<version>/ with the LICENSE-*, NOTICE and font licence files.
# This file exists only on `bcg`; `main` stays an exact mirror of storytold/pdfcraft.
name: BCG web release

on:
  push:
    branches: [bcg]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bcg-web-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PDFCRAFT_BUILD_SHA: ${{ github.sha }}
  # Shown after the version ("0.9.0 (bcg)"), so this build can't be mistaken for upstream's.
  PDFCRAFT_BUILD_LABEL: bcg
  TRUNK_VERSION: 0.21.14

jobs:
  web:
    name: Build and release (wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The craft-fonts build input (Japanese, Arabic and other interface fonts), at the pin
      # upstream's release workflow uses (release.yml `craft-fonts-ref`). Upstream's own web
      # release now builds without it; we keep it so non-Latin interface text has glyphs.
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      # The BCG brand fonts (DESIGN.md: Mulish for the interface, Yeseva One for the wordmark and
      # the Start heading), from google/fonts at a pinned commit and checked by SHA-256. Like
      # craft-fonts they are a build input (ATTRIBUTION.toml `bcg-fonts`), never committed here.
      - name: Fetch the BCG fonts
        env:
          GOOGLE_FONTS_REF: e7db6ca603fd4862010383ff17ffd6cc4ffac1c0
        run: |
          dir="$RUNNER_TEMP/bcg-fonts"
          mkdir -p "$dir"
          base="https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_REF/ofl"
          fetch() {
            curl -fsSL --retry 3 -o "$dir/$2" "$base/$1"
            echo "$3  $dir/$2" | sha256sum -c -
          }
          fetch 'mulish/Mulish%5Bwght%5D.ttf' 'Mulish[wght].ttf' 00f1105796291a2fdda117a0fc7f25d8e68f8010cdbb34a411f60b3bd57717ac
          fetch 'mulish/OFL.txt' 'OFL-Mulish.txt' 097e9ac414d9251c8580c073a13f8899798c66db746de60662148789ca693f19
          fetch 'yesevaone/YesevaOne-Regular.ttf' 'YesevaOne-Regular.ttf' 88362b33820f0011e163e67b1d570fecd442aa8c05eaac89d5162f9c40d9dac3
          fetch 'yesevaone/OFL.txt' 'OFL-YesevaOne.txt' ab592d1abca19428b89d851706fa7815ec25139c6affb45d366577ca63fb91b7
          echo "BCG_FONTS_DIR=$dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: bcg-web
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Build and zip
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          BCG_FONTS_REQUIRED: "1"
        run: |
          PDFCRAFT_BUILD_DATE="$(date -u +%Y-%m-%d)"
          export PDFCRAFT_BUILD_DATE
          packaging/web/package.sh
          # The embedded BCG fonts' licences, beside craft-fonts' OFL-<family>.txt files.
          . packaging/env.sh
          stage="$RUNNER_TEMP/bcg-licences/pdfcraft-web-$VERSION"
          mkdir -p "$stage"
          cp "$BCG_FONTS_DIR/OFL-Mulish.txt" "$BCG_FONTS_DIR/OFL-YesevaOne.txt" "$stage/"
          zip="$PWD/dist/release/pdfcraft-web-$VERSION.zip"
          (cd "$RUNNER_TEMP/bcg-licences" && zip -q9 "$zip" "pdfcraft-web-$VERSION/OFL-Mulish.txt" "pdfcraft-web-$VERSION/OFL-YesevaOne.txt")
      - name: Check the build is rebranded
        run: |
          . packaging/env.sh
          zip="dist/release/pdfcraft-web-$VERSION.zip"
          for f in LICENSE-MIT LICENSE-APACHE NOTICE index.html OFL-Mulish.txt OFL-YesevaOne.txt; do
            unzip -l "$zip" "pdfcraft-web-$VERSION/$f" >/dev/null || { echo "::error::$f missing from $zip"; exit 1; }
          done
          unzip -p "$zip" "pdfcraft-web-$VERSION/index.html" | grep -q '<title>BCG PDF</title>' \
            || { echo "::error::index.html is not titled BCG PDF"; exit 1; }
          # No Discord link left in the app.
          if unzip -p "$zip" "pdfcraft-web-$VERSION/*.wasm" | grep -aq 'discord.gg/artcraft'; then
            echo "::error::the Discord link is still in the build"; exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          . packaging/env.sh
          zip="dist/release/pdfcraft-web-$VERSION.zip"
          sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          tag="bcg-v$VERSION-$GITHUB_RUN_NUMBER"
          {
            echo "BCG PDF web build, based on PdfCraft $VERSION (MIT licensed)."
            echo
            echo "- Commit: \`$GITHUB_SHA\` on \`bcg\`"
            echo "- Asset: \`pdfcraft-web-$VERSION.zip\`"
            echo "- SHA-256: \`$sha\`"
            echo
            echo "To deploy, set this in RebelEFX/bcg-portal \`apps/pdf/pdfcraft.lock.json\`:"
            echo
            echo '```json'
            echo "\"version\": \"$VERSION\","
            echo "\"release\": \"$tag\","
            echo "\"url\": \"https://github.com/$GH_REPO/releases/download/$tag/pdfcraft-web-$VERSION.zip\","
            echo "\"sha256\": \"$sha\","
            echo '```'
          } > notes.md
          gh release create "$tag" "$zip" --target "$GITHUB_SHA" --title "BCG PDF $VERSION (build $GITHUB_RUN_NUMBER)" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
